name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a previous in-flight run for the same ref when a new
# commit lands. Saves CI minutes on rapid pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Verify deck data is committed
        # The Vite build needs `src/data/decks/{a1..c1}.json` at
        # build time (the dynamic imports in `src/data/decks.ts`
        # resolve against these). If a future change accidentally
        # .gitignore's them, this check catches it before the
        # build does.
        run: |
          for lvl in a1 a2 b1 b2 c1; do
            test -f "src/data/decks/${lvl}.json" || {
              echo "::error::src/data/decks/${lvl}.json is missing"
              exit 1
            }
          done

      - name: Typecheck + build
        # `tsc -b` runs as part of `npm run build`. If the
        # TypeScript layer is broken, the build fails with a
        # clear diagnostic. We don't ship the dist/ artifact —
        # this is a CI gate, not a release step.
        run: VITE_BASE=/anki-qazaq/ npm run build:quick

      - name: Run unit tests
        run: npm test

  e2e:
    name: Playwright e2e (UX batch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build the frontend
        # Playwright tests hit the Vite preview server, which
        # needs a prebuilt dist/.
        run: VITE_BASE=/anki-qazaq/ npm run build:quick

      - name: Run Playwright tests
        # The suite boots its own qazaq-api + Vite via playwright.config.ts
        # so we don't need to wire up the dev server manually.
        # RATE_LIMIT_REGISTER=1000 raises the auth limiter for the
        # CI run only — production deploys keep the default of 5
        # per 10 min (the rate limiter reads from env at boot).
        env:
          RATE_LIMIT_REGISTER: '1000'
          RATE_LIMIT_LOGIN: '1000'
        run: npx playwright test e2e/ux-improvements.spec.ts

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: /tmp/screens/
          if-no-files-found: ignore

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: test-results/
          if-no-files-found: ignore

  api-smoke:
    name: API smoke (boot + health)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Boot API and hit /api/health
        # Server.js lives at the repo root after the prod-readiness
        # merge. We start it in the background, wait for the
        # health endpoint to come up, and tear it down.
        env:
          DB_PATH: /tmp/qazaq-ci.sqlite
          PORT: '3099'
        run: |
          node server.js &
          SERVER_PID=$!
          for i in {1..20}; do
            if curl -sf http://127.0.0.1:3099/api/health > /dev/null; then
              echo "API is up"
              curl -sS http://127.0.0.1:3099/api/health | head -1
              exit 0
            fi
            sleep 0.5
          done
          echo "API did not start in time" >&2
          kill $SERVER_PID 2>/dev/null || true
          exit 1

  docker-build:
    name: Docker build (api + web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build qazaq-api
        # Multi-stage Dockerfile — first build is cold (~80 MB final).
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          tags: qazaq-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Build qazaq-web
        # Vite build happens inside the image. No host pre-build
        # needed.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          build-args: VITE_BASE=/anki-qazaq/
          tags: qazaq-web:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
