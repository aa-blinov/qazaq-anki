# docker-compose.yml — Qazaq self-host stack.
#
# Services:
#   qazaq-api          — Node API, port 3001 (internal only)
#   qazaq-web          — nginx serving the Vite static bundle +
#                        proxying /api/* to qazaq-api. Exposed on
#                        host port 8080.
#   qazaq-tts-service  — long-running HTTP server that synthesizes
#                        audio on demand for user-added cards
#                        (POST /synthesize, port 8000). Starts
#                        automatically — the lazy endpoint on the
#                        API depends on it.
#   qazaq-tts          — one-shot pre-generator (the entire deck
#                        pass at build time). Same image as
#                        qazaq-tts-service but with TTS_MODE=oneshot.
#                        Profile `tools` so it never auto-starts —
#                        invoke manually:
#                          docker compose --profile tools run --rm qazaq-tts
#                        Re-running is cheap: skips existing WAVs.
#
# Run:
#   docker compose up -d --build        # starts API + web + tts-service
#   docker compose --profile tools run --rm qazaq-tts   # one-time, ~5 min
#   # Then open http://localhost:8080/ in a browser.
#
# Both containers run as the unprivileged `node` / `nginx` user
# respectively. The SQLite file lives on a named volume; the TTS
# audio lives on a bind mount to ./public/audio/kk/ so the files
# are visible on the host filesystem and survive any rebuild or
# `docker compose down -v` (which only removes named volumes, not
# bind mounts).

services:
  qazaq-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: qazaq-api:latest
    restart: unless-stopped
    environment:
      # Default in the Dockerfile, but we pin it here so the volume
      # mount point and the in-container path stay in sync.
      DB_PATH: /data/qazaq.sqlite
      PORT: 3001
      HOST: 0.0.0.0
      NODE_ENV: production
      # Comma-separated list of allowed origins, OR unset to allow any.
      # In production set this to your public URL, e.g.:
      #   CORS_ORIGIN: https://qazaq.example.com
      # Without it, any website can hit the API on behalf of your users.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    volumes:
      - qazaq-data:/data
    # No host port mapping — the API is only reachable through the
    # web proxy on qazaq-api:3001 (compose's internal DNS). If you
    # need direct access for debugging, uncomment the next line.
    # ports:
    #   - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - qazaq

  qazaq-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: qazaq-web:latest
    restart: unless-stopped
    depends_on:
      qazaq-api:
        condition: service_healthy
    environment:
      # The upstream nginx resolves via compose DNS. The default in
      # nginx.conf is `qazaq-api:3001`; override here if you rename
      # the service or run the API on a different host.
      QAZAQ_API: qazaq-api:3001
    volumes:
      # TTS audio (Piper ONNX, generated by qazaq-tts). The host
      # directory ./public/audio/ is bind-mounted read-only at
      # the nginx document root so /audio/kk/<hash>.wav URLs
      # resolve to ./public/audio/kk/<hash>.wav on the host.
      # Bind mount (not a named volume) so the files live on the
      # host filesystem — visible, backupable, and immune to
      # `docker compose down -v` / `volume prune`. The image
      # itself contains no audio. On a fresh checkout the
      # directory is created automatically by Docker.
      - ./public/audio:/usr/share/nginx/html/audio:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - qazaq

  # One-shot TTS generator. Not started by `docker compose up` —
  # invoke it explicitly when you need to (re)populate the audio
  # directory: `docker compose --profile tools run --rm qazaq-tts`.
  # The first run takes ~5 min, subsequent runs are incremental.
  # The `tools` profile keeps it out of the default `up` flow but
  # lets `run` target it explicitly. The bind mount means the WAVs
  # land directly in ./public/audio/kk/ on the host — no
  # intermediate Docker volume to copy out of.
  qazaq-tts:
    build:
      context: .
      dockerfile: Dockerfile.tts
    image: qazaq-tts:latest
    profiles: ["tools"]
    environment:
      TTS_MODE: oneshot
    volumes:
      - ./public/audio:/audio
    networks:
      - qazaq

  # Long-running TTS HTTP service. Started automatically by
  # `docker compose up`. The Node API calls POST /synthesize
  # here when a user card has no pre-generated audio. Caches
  # results in the bind-mounted ./public/audio/kk/ directory,
  # so a second request for the same word is a sub-millisecond
  # stat() call.
  qazaq-tts-service:
    build:
      context: .
      dockerfile: Dockerfile.tts
    image: qazaq-tts:latest
    restart: unless-stopped
    environment:
      TTS_MODE: service
    volumes:
      - ./public/audio:/audio
    networks:
      - qazaq
    # No host port — only the API (on the same compose network)
    # can reach this container, by hostname `qazaq-tts-service:8000`.
    # If you need to debug from the host, uncomment the next line.
    # ports:
    #   - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  qazaq-data:
    name: qazaq-data

networks:
  qazaq:
    name: qazaq
    driver: bridge
