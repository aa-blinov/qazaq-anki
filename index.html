<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      viewport-fit=cover lets the page extend under the notch and the
      home indicator. Without it, `env(safe-area-inset-*)` resolves to 0
      on every notched device no matter what the stylesheet asks for — it
      is the gate, not a nicety. The insets themselves are consumed as
      `--safe-top` / `--safe-bottom` in src/styles/global.css.

      Deliberately NOT set: `maximum-scale` and `user-scalable`. Pinch
      zoom has to keep working; a 10.8px compact type step is exactly
      the case where a reader may need it.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="description" content="Карточки для изучения казахского языка по уровням CEFR A1–C1. 3 996 отобранных слов, интервальное повторение, бесплатно, работает в браузере." />
    <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1F1E1B" media="(prefers-color-scheme: dark)" />
    <!--
      Content Security Policy — defense in depth against XSS. Everything is
      self-hosted except the Google Fonts CSS. We allow inline styles for the
      React-generated styles and Vite's dev-mode HMR; `unsafe-inline` for
      script-src is allowed only because Vite injects inline <script>
      blocks in dev. The build output doesn't use inline scripts.
      Note: `frame-ancestors` is silently ignored when delivered via a
      <meta> tag (browsers only honour it from real HTTP headers), so we
      rely on the GitHub Pages X-Frame-Options / equivalent header in
      production. Kept here as a no-op hint to the CSP scanner.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' ws: wss:; base-uri 'self'; form-action 'self';"
    />
    <!--
      Typefaces are self-hosted (src/styles/fonts.css) and were pulled
      off fonts.googleapis.com in the polish pass. The CSP above used to
      whitelist both Google hosts; it no longer does, so a stray request
      to them would now be blocked rather than quietly allowed.

      These two preloads are the first paint's actual type. The document
      is <html lang="ru"> and the whole interface is Russian, so the first
      paint is drawn in the *cyrillic* slices — not the latin ones that
      were preloaded before, which only ever served the wordmark and a
      few numerals. Preloading a face the first paint does not use costs
      a request and buys nothing; these are the two files the first
      screen genuinely asks for: Inter for UI text, Source Serif 4 for
      the headings.

      latin and cyrillic-ext are not preloaded, and that is deliberate.
      They only download on a screen that shows a latin-only string
      (the wordmark) or a Kazakh letter — exactly the gating the
      unicode-range split is there to provide.
    -->
    <link
      rel="preload"
      href="/fonts/inter-normal-cyrillic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/sourceserif4-normal-cyrillic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      Set the data-theme attribute on <html> before the first paint.
      Without this, the page briefly renders in the default light
      theme (CSS variables in :root are light) and then flickers to
      dark once React mounts. The script is a self-hosted JS file
      (so prod's `script-src 'self'` CSP still works without
      'unsafe-inline'), and it's NOT type="module" / deferred /
      async, so the browser blocks HTML parsing and runs it inline
      with the rest of <head>. See public/theme-init.js for the
      matching logic and src/contexts/ThemeContext.tsx for the
      React-side counterpart.
    -->
    <script src="/theme-init.js"></script>
    <title>Qazaq — учите казахский с интервальным повторением</title>
    <!--
      Register the service worker for offline app-shell + level JSON
      caching. The script is in /sw.js (served from public/ at root).
      We register AFTER the page is interactive so the SW install
      doesn't compete with the first paint. If the SW fails (Safari
      private mode, an overzealous extension, etc.) the app still
      works — just without the offline shell.
    -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            // eslint-disable-next-line no-console
            console.warn('[sw] registration failed:', err);
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
