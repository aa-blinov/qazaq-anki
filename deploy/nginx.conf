# nginx config for the Qazaq web container.
#
# Two jobs:
#   1. Serve the Vite static bundle from /usr/share/nginx/html.
#   2. Reverse-proxy /api/* to the qazaq-api service on its internal
#      port (3001 inside the compose network). This way a single
#      domain (port 8080) serves both frontend and API, no CORS.
#
# `try_files` falls back to index.html for any non-asset path so the
# SPA's client-side router can take over (no 404 on /study/a1 etc).
#
# Override the API upstream via the QAZAQ_API env var if you put the
# API on a different host. The default `qazaq-api:3001` is the
# service name from docker-compose.yml.

# HSTS only makes sense when the request reached us over HTTPS;
# the map below pins HTTPS only for users who already arrived over
# TLS, so a first-time visitor on plain HTTP doesn't get their
# browser stuck in an HTTPS-only state.
map $scheme $hsts_header {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

upstream qazaq_api {
    server ${QAZAQ_API} fail_timeout=0;
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip text payloads (HTML / JSON / JS) — Vite already minifies
    # but the overhead on a cold cache is noticeable.
    #
    # Audio is deliberately absent from gzip_types: the clips are FLAC,
    # already entropy-coded, and running them through DEFLATE costs CPU
    # on every request to save nothing.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    # TTS clips. The type is declared here rather than left to the
    # stock mime.types because every response in this server block
    # carries `X-Content-Type-Options: nosniff` — under nosniff a
    # browser refuses to play an audio element whose Content-Type it
    # does not recognise, so a missing mapping for .flac would turn
    # into silent, undebuggable playback failures rather than a
    # download.
    #
    # NOTE: a `types { }` block here REPLACES the inherited map rather
    # than adding to it, so both extensions this location serves have
    # to be listed: the clips (.flac) and the hash manifest
    # (manifest.json), which the browser reads as JSON.
    # The per-language hash manifest is NOT immutable, unlike the clips
    # beside it. It grows every time the TTS service synthesises a word
    # a user added, and it is what tells the browser whether a speak
    # button should exist at all — cache it for a year and a newly
    # added word silently never gets a button. Matched exactly so it
    # cannot be confused with any other .json under /audio/.
    location = /audio/kk/manifest.json {
        access_log off;
        default_type application/octet-stream;
        types { application/json json; }
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /audio/ru/manifest.json {
        access_log off;
        default_type application/octet-stream;
        types { application/json json; }
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /audio/ {
        access_log off;
        default_type application/octet-stream;
        types {
            audio/flac             flac;
            application/json       json;
        }
        # The clips are content-addressed by the SHA-1 of the word, so
        # a given URL always means the same waveform and can be cached
        # indefinitely.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Repeated rather than inherited: nginx drops the server-level
        # add_header set as soon as a location declares one of its own
        # (see the note on location /assets/).
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri =404;
    }

    # Hashed Vite assets carry a content hash in the filename and are
    # safe to cache forever. The shell HTML must NOT be cached or
    # the user gets stuck on a stale build.
    #
    # NOTE: nginx's `add_header` is NOT inherited by inner location
    # blocks once they declare their own `add_header`. We have to
    # repeat the security headers here (and in `location /`) so the
    # protections cover the cached asset responses too.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # Healthcheck for compose / k8s.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # API: hand off to the upstream. The API sets its own CORS
    # headers (or just lets same-origin requests through), so we
    # don't add Access-Control-Allow-Origin here.
    location /api/ {
        proxy_pass http://qazaq_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Defense-in-depth security headers. The Express API also sends
    # some of these (see server/server.js), but we duplicate them at
    # the edge so the protections hold for static assets too.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security $hsts_header always;
    # Strict CSP for the production bundle. The <meta> CSP in
    # index.html is dev-friendly (includes 'unsafe-eval' for Vite
    # HMR); HTTP headers win over <meta> when they conflict, so this
    # stricter policy is what the browser actually enforces once
    # nginx is in front of the bundle.
    #
    # The build output has NO inline scripts (Vite compiles them all
    # into hashed chunks under /assets/), so 'unsafe-inline' is NOT
    # needed for scripts. Inline styles from React CSS-in-JS / Vite
    # dev HMR are still permitted via 'unsafe-inline' on style-src.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # SPA fallback. Anything that isn't a real file is the SPA shell.
    # Security headers repeated here too (see note on `location /assets/`).
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
